# Archetype: AI-agent workers (call an LLM + tools, I/O-bound).
#
# Agent pods spend their time waiting on the LLM API and tool calls, so CPU
# stays low while they are overloaded. Read the signals that actually move:
#
#   spec.metrics      task p99, failed-task %, task rate (the 4 slots, remapped)
#   spec.logPatterns  agentic failure lines (rate limits, tool timeouts,
#                     context overflow); a saturation line reuses the built-in
#                     connection-pool-exhausted name so rule 2 can fire on it
#   spec.backlog      queued tasks → desired ≈ ceil(backlog / targetPerReplica)
#   spec.agentic      provider 429 rate and token budget:
#                       429 % ≥ rateLimitHoldPercent  → HOLD (the provider quota
#                         is shared by every pod; more workers = more 429s)
#                       budget % ≥ tokenBudgetCapPercent → no scale-up (cost guardrail)
#
# Metric names follow the demo workload (cmd/agentrunner). Replace them with
# your framework's equivalents (LangGraph/LangChain callbacks, OpenTelemetry
# GenAI semantic conventions, your queue's depth gauge, …).
apiVersion: scaling.autoscaler.io/v1alpha1
kind: AgenticAutoscaler
metadata:
  name: agent-runner-autoscaler
  namespace: agents
spec:
  targetDeployment: agent-runner
  prometheusURL: "http://prometheus.monitoring:9090"
  metrics:
    latencyP99:        'histogram_quantile(0.99, sum by (le) (rate(agent_task_seconds_bucket{app="$TARGET"}[2m]))) >= 0'
    errorRate:         'sum(rate(agent_tasks_total{app="$TARGET",result!="ok"}[2m])) / (sum(rate(agent_tasks_total{app="$TARGET"}[2m])) > 0) * 100'
    requestsPerSecond: 'sum(rate(agent_tasks_total{app="$TARGET"}[2m]))'
  logSource:
    type: loki
    loki:
      url: "http://loki.monitoring:3100"
      query: '{namespace="agents", app="agent-runner"}'
  logPatterns:
    - name: connection-pool-exhausted
      regex: 'connection pool exhausted|worker pool saturated'
      severity: critical
      score: 80
    - name: llm-rate-limited
      regex: 'rate.?limit|HTTP 429'
      severity: critical
      score: 80
    - name: tool-timeout
      regex: 'tool .* timed out'
      severity: warning
      score: 60
    - name: context-overflow
      regex: 'context length exceeded'
      severity: warning
      score: 50
  backlog:
    query: 'sum(agent_tasks_queued{app="$TARGET"})'
    targetPerReplica: 2        # ~half a pod's worker slots queued; more means tasks wait
  agentic:
    llmRateLimitQuery: '100 * sum(rate(agent_llm_calls_total{app="$TARGET",outcome="rate_limited"}[2m])) / (sum(rate(agent_llm_calls_total{app="$TARGET"}[2m])) > 0)'
    rateLimitHoldPercent: 20
    tokenBudgetQuery: 'max(llm_token_budget_used_percent)'
    tokenBudgetCapPercent: 90

  minReplicas: 2
  maxReplicas: 30
  cooldownSeconds: 60
  policy:
    scaleDownStabilizationSeconds: 300   # a drained queue is not spare capacity
  dryRun: true
  hpaCoexistence:
    mode: advisor
  aiProvider:
    provider: anthropic
    secretRef: ai-provider-secret

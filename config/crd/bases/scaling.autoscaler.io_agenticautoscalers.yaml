---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: agenticautoscalers.scaling.autoscaler.io
spec:
  group: scaling.autoscaler.io
  names:
    kind: AgenticAutoscaler
    listKind: AgenticAutoscalerList
    plural: agenticautoscalers
    singular: agenticautoscaler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetDeployment
      name: Target
      type: string
    - jsonPath: .spec.minReplicas
      name: Min
      type: integer
    - jsonPath: .spec.maxReplicas
      name: Max
      type: integer
    - jsonPath: .status.currentReplicas
      name: Current
      type: integer
    - jsonPath: .spec.dryRun
      name: DryRun
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgenticAutoscaler is the Schema for the agenticautoscalers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgenticAutoscalerSpec defines the desired state of AgenticAutoscaler.
            properties:
              aiProvider:
                description: AIProvider configures the AI reasoning backend.
                properties:
                  provider:
                    description: 'Provider is the AI backend: "anthropic", "openai",
                      or "ollama".'
                    enum:
                    - anthropic
                    - openai
                    - ollama
                    type: string
                  secretRef:
                    description: |-
                      SecretRef is the name of the Kubernetes Secret holding the API key.
                      Not required when Provider is "ollama".
                    type: string
                required:
                - provider
                type: object
              cooldownSeconds:
                description: CooldownSeconds is the minimum number of seconds between
                  consecutive scale actions.
                format: int32
                minimum: 0
                type: integer
              detection:
                description: |-
                  Detection tunes cross-window log-pattern persistence before a scale
                  decision is taken. Omitting it preserves single-window behaviour.
                properties:
                  consecutiveWindows:
                    default: 1
                    description: |-
                      ConsecutiveWindows is the number of consecutive reconcile windows a
                      sustained log pattern (e.g. connection-pool-exhausted) must persist
                      before the sustained scale-up rules fire. The default of 1 preserves the
                      original single-window behaviour; the timeout-storm demo sets 3 to match
                      the "across 3 consecutive log windows" annotation. Emergency signals such
                      as OOMKilled are never gated by this counter.
                    format: int32
                    minimum: 1
                    type: integer
                  scaleDownQuietWindowMinutes:
                    default: 15
                    description: |-
                      ScaleDownQuietWindowMinutes is how long all signals must stay healthy
                      (zero severity and CPU < 20%) before the conservative scale-down rule
                      releases capacity to min+1. Default 15. Lower it for demos or faster
                      scale-down; raise it to be more conservative.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              dryRun:
                description: |-
                  DryRun enables observation-only mode: decisions are logged but never applied.
                  New deployments must run with DryRun true for at least 7 days before enabling live scaling.
                type: boolean
              hpaCoexistence:
                description: |-
                  HPACoexistence controls how this operator interacts with an existing HPA on the same Deployment.
                  When Mode is "calibrated", MinReplicas must be >= HPA minReplicas and MaxReplicas must be <= HPA maxReplicas.
                properties:
                  hpaName:
                    description: |-
                      HPAName is the name of the HorizontalPodAutoscaler to coexist with.
                      Required when Mode is "calibrated".
                    type: string
                  hpaNamespace:
                    description: HPANamespace is the namespace of the HPA. Defaults
                      to the CR namespace.
                    type: string
                  mode:
                    description: |-
                      Mode is either "owner" (agentic autoscaler is sole controller) or
                      "calibrated" (operates inside the HPA's replica envelope as a safety net).
                    enum:
                    - owner
                    - calibrated
                    type: string
                required:
                - mode
                type: object
              logPatterns:
                description: |-
                  LogPatterns adds custom log patterns to the operator's built-in set so
                  adopters can match their own incident strings without forking. Each entry
                  is merged with the defaults (an entry reusing a built-in name overrides
                  it); an entry that fails to compile is skipped and reported in
                  status.logPatternWarnings. Empty preserves the built-in behaviour.
                items:
                  description: |-
                    LogPatternSpec defines a custom log pattern that adopters can add to the
                    operator's built-in set without forking. Each entry is compiled and merged
                    with the defaults every reconcile; an entry with the same Name as a built-in
                    pattern overrides it. An entry that fails to compile is skipped (never fatal)
                    and reported in status.logPatternWarnings.
                  properties:
                    name:
                      description: |-
                        Name is the stable identifier surfaced in decisions and Grafana
                        annotations (e.g. "tls-handshake-timeout"). Reusing a built-in name
                        overrides that pattern.
                      minLength: 1
                      type: string
                    regex:
                      description: Regex is the RE2 regular expression matched against
                        each log message.
                      minLength: 1
                      type: string
                    score:
                      description: |-
                        Score is this pattern's contribution to the fused SeverityScore, given as a
                        weight from 0 to 100 (mapped internally to 0.0–1.0). An integer is used
                        rather than a float because floats are discouraged in CRDs for
                        cross-language portability. Example: 85 contributes a 0.85 severity weight.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    severity:
                      description: Severity is "warning" or "critical".
                      enum:
                      - warning
                      - critical
                      type: string
                  required:
                  - name
                  - regex
                  - score
                  - severity
                  type: object
                type: array
              logSource:
                description: LogSource configures the log collection backend.
                properties:
                  kafka:
                    description: Kafka holds configuration when Type is "kafka".
                    properties:
                      brokers:
                        description: Brokers is the list of Kafka broker addresses.
                        items:
                          type: string
                        minItems: 1
                        type: array
                      groupID:
                        description: GroupID is the consumer group ID.
                        minLength: 1
                        type: string
                      topic:
                        description: Topic is the Kafka topic to consume.
                        minLength: 1
                        type: string
                    required:
                    - brokers
                    - groupID
                    - topic
                    type: object
                  loki:
                    description: Loki holds configuration when Type is "loki".
                    properties:
                      query:
                        description: Query is the LogQL query used to fetch relevant
                          log lines.
                        minLength: 1
                        type: string
                      url:
                        description: URL is the base URL of the Loki HTTP API.
                        minLength: 1
                        type: string
                    required:
                    - query
                    - url
                    type: object
                  type:
                    description: Type is the log source type; must be "loki" or "kafka".
                    enum:
                    - loki
                    - kafka
                    type: string
                required:
                - type
                type: object
              maxReplicas:
                description: MaxReplicas is the upper bound on replica count the operator
                  may set.
                format: int32
                minimum: 1
                type: integer
              metrics:
                description: |-
                  Metrics optionally overrides the PromQL queries used to read signals, so
                  services that do not use the default metric names can still be autoscaled.
                properties:
                  cpuUtilization:
                    description: CPUUtilization must return average CPU utilisation
                      as a percentage.
                    type: string
                  errorRate:
                    description: ErrorRate must return the error percentage (0-100).
                    type: string
                  latencyP99:
                    description: LatencyP99 must return p99 latency in seconds.
                    type: string
                  requestsPerSecond:
                    description: RequestsPerSecond must return the request rate.
                    type: string
                type: object
              minReplicas:
                description: MinReplicas is the lower bound on replica count the operator
                  may set.
                format: int32
                minimum: 0
                type: integer
              namespace:
                description: |-
                  Namespace is the namespace of the target Deployment.
                  Defaults to the namespace of this AgenticAutoscaler CR when omitted.
                type: string
              observability:
                description: Observability configures Grafana annotation emission
                  for decision audit trails.
                properties:
                  grafanaURL:
                    description: GrafanaURL is the base URL of the Grafana instance.
                    minLength: 1
                    type: string
                  secretRef:
                    description: SecretRef is the name of the Kubernetes Secret holding
                      the Grafana API token.
                    minLength: 1
                    type: string
                required:
                - grafanaURL
                - secretRef
                type: object
              prometheusURL:
                description: PrometheusURL is the base URL of the Prometheus HTTP
                  API.
                minLength: 1
                type: string
              targetDeployment:
                description: TargetDeployment is the name of the Deployment this CR
                  manages.
                minLength: 1
                type: string
            required:
            - cooldownSeconds
            - logSource
            - maxReplicas
            - minReplicas
            - prometheusURL
            - targetDeployment
            type: object
          status:
            description: AgenticAutoscalerStatus defines the observed state of AgenticAutoscaler.
            properties:
              consecutivePatternWindows:
                description: |-
                  ConsecutivePatternWindows counts how many consecutive reconciles have seen
                  at least one matched log pattern. It backs spec.detection.consecutiveWindows:
                  the sustained scale-up rules fire only once this counter reaches the
                  configured threshold. It resets to 0 on the first pattern-free reconcile.
                format: int32
                type: integer
              currentReplicas:
                description: CurrentReplicas is the replica count of the target Deployment
                  as of the last reconcile.
                format: int32
                type: integer
              hpaCoexistenceStatus:
                description: |-
                  HPACoexistenceStatus reflects the current HPA coexistence mode:
                  "owner", "calibrated", or "conflict-detected".
                type: string
              lastCleanSince:
                description: |-
                  LastCleanSince is when the most recent matched log pattern last cleared.
                  It is the durable, cross-reconcile anchor for the sustained-quiet
                  scale-down rule: the rule may fire only once the clean window has elapsed
                  since this timestamp. The controller starts it on the first pattern-free
                  reconcile and clears it whenever a pattern reappears. A nil value means
                  patterns are currently active (or were on the last reconcile).
                format: date-time
                type: string
              lastDecisionReason:
                description: LastDecisionReason is the human-readable explanation
                  of the last scaling decision.
                type: string
              lastScaleTime:
                description: LastScaleTime is the timestamp of the most recent live
                  scale action.
                format: date-time
                type: string
              logPatternWarnings:
                description: |-
                  LogPatternWarnings lists custom patterns from spec.logPatterns that were
                  skipped this reconcile because they failed to compile (e.g. an invalid
                  regex). It is empty when every custom pattern is valid or none are set.
                  The operator continues with the remaining valid patterns.
                items:
                  type: string
                type: array
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was produced from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

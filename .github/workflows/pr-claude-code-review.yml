name: PR — Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-20250514
          prompt: |
            Review this PR using the agent defined in .claude/agents/code-reviewer.md.
            Run `git diff origin/main...HEAD` to see what changed.
            Pay extra attention to:
            - Any changes to pkg/policy/ (safety-critical)
            - Any changes to pkg/reasoning/prompt.go (AI prompt)
            - Any new imports in pkg/signals/ or pkg/fusion/ that might violate the no-k8s rule

name: Scheduled — code quality (weekly)

on:
  schedule:
    - cron: '0 8 * * 0'   # Every Sunday at 08:00 UTC
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write          # claude-code-action@beta mints a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s v1.57.0
          ./bin/golangci-lint run ./... --out-format json > lint-report.json 2>&1 || true

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-20250514
          direct_prompt: |
            Review the lint report in lint-report.json.
            Pick the two most impactful packages to improve this week.
            Fix issues, ensure tests still pass with `go test ./...`.
            Open a PR titled "chore: weekly quality sweep <YYYY-WW>".

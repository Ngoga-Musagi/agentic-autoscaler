# Load generator — DEMO / TESTING ONLY. Do not deploy to production.
#
# A small HTTP load driver with a control API the console proxies to. Drive
# traffic at a service and watch the AgenticAutoscaler scale it up; stop and
# watch it scale back down.
#
#   Build + load into kind:  make loadgen-image
#   Deploy:                   kubectl apply -f deploy/loadgen/loadgen.yaml
#   The operator reaches it at: http://loadgen.loadgen.svc.cluster.local:8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/part-of: agentic-autoscaler
    app.kubernetes.io/component: loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: loadgen
  labels:
    app: loadgen
    app.kubernetes.io/part-of: agentic-autoscaler
    app.kubernetes.io/component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: agentic-autoscaler-loadgen:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: control
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: "1", memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loadgen
  namespace: loadgen
  labels:
    app: loadgen
spec:
  type: ClusterIP
  selector:
    app: loadgen
  ports:
    - name: control
      port: 8080
      targetPort: 8080

{{/*
AI provider API key secret.

This template creates a placeholder Secret so the operator can start.
In production, replace the values with real credentials via:
  --set-string aiProvider.apiKey=<key>   (not recommended — visible in shell history)
or manage the Secret out-of-band (Vault, ESO, SealedSecrets) and point
aiProvider.secretRef at your externally-managed Secret name instead.
*/}}
{{- if not (eq .Values.aiProvider.provider "ollama") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.aiProvider.secretRef }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-autoscaler.labels" . | nindent 4 }}
  annotations:
    # Replace this placeholder before enabling live mode.
    helm.sh/note: "Set API_KEY to your provider key before removing dryRun."
type: Opaque
stringData:
  # Key read by the operator at startup:
  #   ANTHROPIC_API_KEY  when aiProvider.provider=anthropic
  #   OPENAI_API_KEY     when aiProvider.provider=openai
  API_KEY: "REPLACE_ME"
{{- end }}
---
{{/*
Grafana annotation token secret.

Leave GRAFANA_TOKEN empty when grafana.url is unset — the operator skips
Grafana annotation push when GRAFANA_URL is not configured.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.secretRef }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-autoscaler.labels" . | nindent 4 }}
  annotations:
    helm.sh/note: "Set GRAFANA_TOKEN to a Grafana service account token."
type: Opaque
stringData:
  GRAFANA_TOKEN: "REPLACE_ME"

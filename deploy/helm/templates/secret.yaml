{{/*
AI provider API key secret.

Created ONLY when absent — the chart never reads or overwrites an existing
Secret, so a real key set out-of-band (bootstrap.sh, kubectl, Vault, ESO,
SealedSecrets) survives every `helm upgrade`. `resource-policy: keep` stops
Helm deleting it on uninstall. Rotate by patching the Secret directly; changing
aiProvider.apiKey does not touch an existing Secret.

Set the initial value with --set-string aiProvider.apiKey=<key> (visible in
shell history) or, preferably, create the Secret yourself and leave apiKey="".
*/}}
{{- if and (not (eq .Values.aiProvider.provider "ollama")) .Values.aiProvider.createSecret }}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.aiProvider.secretRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.aiProvider.secretRef }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-autoscaler.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    # Key read by the operator at startup:
    #   ANTHROPIC_API_KEY  when aiProvider.provider=anthropic
    #   OPENAI_API_KEY     when aiProvider.provider=openai
    helm.sh/note: "Patch API_KEY with your provider key before enabling live mode."
type: Opaque
stringData:
  API_KEY: {{ .Values.aiProvider.apiKey | default "REPLACE_ME" | quote }}
{{- end }}
{{- end }}
{{/*
Grafana annotation token secret — same create-if-absent discipline.
*/}}
{{- if .Values.grafana.createSecret }}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.grafana.secretRef) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.secretRef }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-autoscaler.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/note: "Set GRAFANA_TOKEN to a Grafana service account token."
type: Opaque
stringData:
  GRAFANA_TOKEN: {{ .Values.grafana.token | default "REPLACE_ME" | quote }}
{{- end }}
{{- end }}

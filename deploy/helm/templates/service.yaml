apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-autoscaler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-autoscaler.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentic-autoscaler.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: query-ui
      port: 8090
      targetPort: 8090
      protocol: TCP

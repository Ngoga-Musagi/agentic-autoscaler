# -- Number of operator replicas. Keep at 1; leader election is not yet wired.
replicaCount: 1

image:
  # -- OCI image repository for the operator binary.
  repository: ghcr.io/ngoga-musagi/agentic-autoscaler
  # -- Image tag. Defaults to the chart appVersion when set to "".
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  # -- Name of the ServiceAccount the operator Pod runs as.
  name: agentic-autoscaler

aiProvider:
  # -- AI backend to use: "anthropic", "openai", or "ollama".
  provider: "anthropic"
  # -- Name of the Kubernetes Secret that holds the provider API key.
  # Key inside the Secret must be "API_KEY".
  # Not required when provider is "ollama".
  secretRef: "agentic-autoscaler-ai-key"
  # -- Override the model name. When empty the operator picks a safe default
  # per provider (claude-sonnet-5 / gpt-4o / qwen2.5:3b).
  model: ""
  # -- Whether the chart creates the API key Secret when it is ABSENT. The chart
  # never reads or overwrites an existing Secret, so a real key survives every
  # upgrade. Set false to manage it entirely out-of-band (Vault, ESO, etc.).
  createSecret: true
  # -- Initial API key, used ONLY when the chart first creates the Secret. Prefer
  # leaving this empty and setting the key out-of-band — rotate by patching the
  # Secret directly; changing this value never updates an existing Secret.
  apiKey: ""

grafana:
  # -- Base URL of the Grafana instance for decision annotations.
  # Leave empty to disable Grafana annotation push.
  url: ""
  # -- Name of the Kubernetes Secret holding the Grafana API token.
  # Key inside the Secret must be "GRAFANA_TOKEN".
  secretRef: "agentic-autoscaler-grafana-token"
  # -- Whether the chart creates the Grafana token Secret when ABSENT. Like the
  # AI key, an existing Secret is never overwritten.
  createSecret: true
  # -- Grafana token, used only when the chart first creates the Secret.
  token: ""

console:
  # -- Allow the web console (:8090) to create/edit/delete AgenticAutoscaler CRs
  # and drive the load generator. Default false keeps the console read-only.
  # Enabling this lets anyone who can reach :8090 (with the token, if set) change
  # autoscaling cluster-wide — read .claude/rules/security.md before turning on.
  writeEnabled: false
  # -- Name of an existing Secret holding key CONSOLE_AUTH_TOKEN. When set, every
  # mutating console request must present it as a Bearer token. The chart never
  # creates this Secret — manage it out-of-band. Empty disables auth.
  authSecretRef: ""
  # -- Base URL of the load generator control API. Empty hides the Load tab.
  # Demo value: http://loadgen.loadgen.svc.cluster.local:8080
  loadgenURL: ""

hpa:
  # -- Default HPA coexistence mode for new AgenticAutoscaler CRs.
  # "calibrated" = nested within HPA bounds (safe default for new rollouts).
  # "owner"      = agentic autoscaler is sole controller (disable HPA first).
  coexistenceMode: "calibrated"

# -- Start new deployments in dry-run mode. Decisions are logged but never
# applied. Disable only after reviewing the decision log for 7+ days.
dryRun: true

ollama:
  # -- Deploy the bundled Ollama sub-chart for fully on-prem, open-source
  # reasoning (no cloud account). The default model (qwen2.5:3b) runs on a
  # node with ~4-6 GB allocatable RAM, CPU-only — no GPU required.
  enabled: false
  # -- Ollama model to pull and serve. Must fit in the node's allocatable RAM.
  # Small (~4B) options that follow the JSON contract well: qwen2.5:3b (default),
  # qwen3:4b, llama3.2:3b, gemma2:2b. Larger models need proportionally more RAM.
  model: "qwen2.5:3b"
  # -- Namespace to deploy Ollama into.
  namespace: "ollama"
  image:
    repository: ollama/ollama
    tag: "0.1.44"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "6Gi"
  # -- Node selector applied to the Ollama Pod (GPU / high-memory node pool).
  nodeSelector: {}
  # -- Tolerations for the ollama=true:NoSchedule taint on dedicated nodes.
  tolerations:
    - key: "ollama"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Extra environment variables injected into the operator container.
# Useful for debugging flags or feature overrides.
extraEnv: []
# - name: LOG_LEVEL
#   value: debug

metrics:
  # -- Port the operator exposes Prometheus metrics on.
  port: 8080

networkPolicy:
  # -- Deploy a NetworkPolicy to restrict operator egress to known endpoints.
  enabled: true
  # -- Namespace where Prometheus is running.
  prometheusNamespace: "monitoring"
  prometheusPort: 9090
  # -- Namespace where Loki is running.
  lokiNamespace: "monitoring"
  lokiPort: 3100
